umn;align-items:center;color:#fff;font-weight:700;text-align:center}\n.ov.show{display:flex}\n#lobby,#online{background:linear-gradient(#4ec0ca,#2a8fa0);padding:12px;gap:8px}\n#over,#vsover,#chal{background:rgba(0,0,0,.6);justify-content:center;gap:10px}\n#vsmenu,#nameov{background:linear-gradient(#4ec0ca,#2a8fa0);justify-content:center;gap:12px;padding:16px}\n#chal,#nameov{z-index:5}\nh1{margin:2px 0 0;font-size:26px;text-shadow:0 2px 0 #222}\n.coins{background:rgba(0,0,0,.35);padding:5px 14px;border-radius:20px;font-size:16px}\n.grid{flex:1;width:100%;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start;padding:2px}\n.card{background:rgba(255,255,255,.18);border:2px solid transparent;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}\n.card.sel{border-color:#ffd93b;background:rgba(255,217,59,.25)}\n.card canvas{width:56px;height:56px;border-radius:8px}\nbutton{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:#ff9f1c;color:#fff;box-shadow:0 3px 0 #b36b00}\nbutton:disabled{background:#777;box-shadow:0 3px 0 #444;cursor:not-allowed;opacity:.7}\nbutton.big{font-size:17px;padding:9px 18px}\nbutton.alt{background:#3a86ff;box-shadow:0 3px 0 #1d4fa8}\nbutton.sm{padding:5px 10px;font-size:13px}\nbutton.tab.on{background:#ffd93b;color:#222;box-shadow:0 3px 0 #b39500}\n.card button{padding:5px 10px;font-size:13px;width:100%}\n.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}\ninput{font:inherit;font-weight:700;padding:10px;border-radius:10px;border:0;text-align:center;width:200px}\n#plist{width:100%;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-weight:500}\n.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.18);padding:8px 10px;border-radius:10px;font-size:14px;text-align:left}\nsmall{font-weight:500;opacity:.9;max-width:300px}\np{margin:0;font-size:12px;opacity:.75;text-align:center;padding:0 8px}\n<\/style>\n<\/head>\n<body>\n<div id=\"wrap\">\n  <canvas id=\"c\" width=\"400\" height=\"600\"><\/canvas>\n  <div id=\"lobby\" class=\"ov show\">\n    <h1>Flappy Lobby<\/h1>\n    <div class=\"coins\">\ud83d\udc64 <span id=\"nameTxt\"><\/span> \u00b7 \ud83e\ude99 <span id=\"coinTxt\">0<\/span> \u00b7 Best <span id=\"bestTxt\">0<\/span><\/div>\n    <div class=\"row\"><button class=\"big\" id=\"playBtn\">\u25b6 Play<\/button><button class=\"big alt\" id=\"vsBtn\" disabled>\ud83c\udf10 Online\u2026<\/button><\/div>\n    <div class=\"row\">\n      <button class=\"sm tab on\" id=\"tabB\">\ud83d\udc24 Birds<\/button><button class=\"sm tab\" id=\"tabT\">\ud83c\udfa8 Themes<\/button>\n      <button class=\"sm\" id=\"dayBtn\">\ud83c\udf81 +50<\/button><button class=\"sm alt\" id=\"muteBtn\">\ud83d\udd0a<\/button><button class=\"sm alt\" id=\"nameBtn\">\u270f\ufe0f Name<\/button>\n    <\/div>\n    <div class=\"grid\" id=\"grid\"><\/div>\n  <\/div>\n  <div id=\"nameov\" class=\"ov\">\n    <h1>Pick your name<\/h1>\n    <input id=\"nameIn\" maxlength=\"14\" placeholder=\"Your name\" autocomplete=\"off\">\n    <button class=\"big\" id=\"nameGo\">Let's go!<\/button>\n    <small>Other players can search for this name to challenge you online.<\/small>\n  <\/div>\n  <div id=\"online\" class=\"ov\">\n    <h1>Players Online<\/h1>\n    <input id=\"srch\" placeholder=\"\ud83d\udd0d Search a name\u2026\" autocomplete=\"off\" style=\"width:90%\">\n    <div id=\"olMsg\" style=\"font-size:14px;min-height:18px\"><\/div>\n    <div id=\"plist\"><\/div>\n    <button class=\"alt\" id=\"olBack\">\u2190 Back<\/button>\n  <\/div>\n  <div id=\"chal\" class=\"ov\">\n    <h1 id=\"chalTxt\">Challenge!<\/h1>\n    <div class=\"row\"><button class=\"big\" id=\"accBtn\">\u2694 Accept<\/button><button class=\"big alt\" id=\"decBtn\">Decline<\/button><\/div>\n  <\/div>\n  <div id=\"over\" class=\"ov\">\n    <h1 style=\"color:#ff6b6b\">Game Over<\/h1>\n    <div id=\"medal\" style=\"font-size:40px\"><\/div>\n    <div style=\"font-size:24px\">Score: <span id=\"sTxt\">0<\/span> <span id=\"newBest\" style=\"color:#ffd93b\"><\/span><\/div>\n    <div style=\"font-size:20px;color:#ffd93b\">+<span id=\"eTxt\">0<\/span> \ud83e\ude99 earned<\/div>\n    <div style=\"font-size:18px\">Best: <span id=\"bTxt\">0<\/span><\/div>\n    <div class=\"row\"><button id=\"retryBtn\">\u21bb Retry<\/button><button class=\"alt\" id=\"shopBtn\">\ud83d\uded2 Lobby<\/button><\/div>\n  <\/div>\n  <div id=\"vsmenu\" class=\"ov\">\n    <h1>Online Versus<\/h1>\n    <div id=\"vsStatus\" style=\"font-size:18px\"><\/div>\n    <button class=\"alt\" id=\"vsBack\">Cancel<\/button>\n  <\/div>\n  <div id=\"vsover\" class=\"ov\">\n    <h1 id=\"vsRes\">You win!<\/h1>\n    <div style=\"font-size:22px\"><span id=\"vsMeN\"><\/span> <span id=\"vsMe\">0<\/span> &nbsp;\u00b7&nbsp; <span id=\"vsOpN\"><\/span> <span id=\"vsOp\">0<\/span><\/div>\n    <div style=\"font-size:20px;color:#ffd93b\">+<span id=\"vsEarn\">0<\/span> \ud83e\ude99 earned<\/div>\n    <div class=\"row\"><button id=\"rematchBtn\">\u21bb Rematch<\/button><button class=\"alt\" id=\"vsLobbyBtn\">\ud83d\uded2 Lobby<\/button><\/div>\n  <\/div>\n<\/div>\n<p>Tap, click or Space to flap \u00b7 2 \ud83e\ude99 per pipe, +3 bonus every 5 pipes \u00b7 win online for +25<\/p>\n<script>\nconst SKINS=[\n {n:'Classic',p:0,b:'#ffd93b',w:'#f4b400'},{n:'Cherry',p:50,b:'#ff5c5c',w:'#c62828'},\n {n:'Sky',p:150,b:'#4dabf7',w:'#1c7ed6'},{n:'Leaf',p:300,b:'#69db7c',w:'#2f9e44'},\n {n:'Grape',p:600,b:'#b197fc',w:'#7048e8'},{n:'Golden',p:1000,b:'#ffd700',w:'#ff9800'},\n {n:'Ghost',p:1500,b:'#e8eaf6',w:'#9fa8da'},{n:'Neon',p:2500,b:'#39ff14',w:'#00c853'}\n];\nconst THEMES=[\n {n:'Day',p:0,sky:['#4ec0ca','#bfe9ee'],pipe:'#5cb85c',pe:'#2d7a2d',gr:'#73bf2e',gd:'#ded895',cl:'rgba(255,255,255,.7)'},\n {n:'Sunset',p:200,sky:['#ff7e5f','#feb47b'],pipe:'#b5523b',pe:'#6e2a1b',gr:'#a0522d',gd:'#e0b988',cl:'rgba(255,230,200,.6)'},\n {n:'Night',p:400,sky:['#0b1026','#3a4a8c'],pipe:'#3d9970',pe:'#1b5e3f',gr:'#2e7d32',gd:'#4a4a5a',cl:'rgba(255,255,255,.15)'},\n {n:'Candy',p:800,sky:['#ff9ff3','#fff0f6'],pipe:'#ff6b9d',pe:'#c2185b',gr:'#f78fb3',gd:'#ffe0ef',cl:'rgba(255,255,255,.85)'}\n];\nlet save={coins:0,best:0,owned:[0],sel:0,themes:[0],th:0,name:'',mute:false,day:''};\ntry{const s=JSON.parse(localStorage.getItem('flappySave'));if(s&&Array.isArray(s.owned))save=Object.assign(save,s)}catch(e){}\nfunction persist(){try{localStorage.setItem('flappySave',JSON.stringify(save))}catch(e){}}\nconst coinsFor=s=>s*2+Math.floor(s/5)*3;\n\nconst cv=document.getElementById('c'),x=cv.getContext('2d'),W=400,H=600,GROUND=520,wrap=document.getElementById('wrap');\nconst $=id=>document.getElementById(id);\nconst GRAV=0.45,FLAP=-7.5,GAP=150,PW=60,SPEED=2.6,BX=100;\nlet state='lobby',mode='solo',bird,world,frames=0,score=0,groundX=0,over=0,tab='birds';\nlet room=null,vroom=null,vcode='',myNonce='',mySt='wait',opp=null,cdStart=0,target=null,waitT=0,incoming=null,dismissed={};\n\n/* sound */\nlet ac;function sfx(f,d,t,v){if(save.mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.07,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}\n\nfunction mk(seed){let a=seed>>>0;const tops=[];return{top(i){while(tops.length<=i){a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;tops.push(80+(((t^t>>>14)>>>0)/4294967296)*(GROUND-GAP-160))}return tops[i]}}}\nfunction pipesAt(f){const n=Math.floor((f-1)/90),r=[];for(let i=Math.max(0,n-3);i<=n;i++){const px=W-(f-1-90*i)*SPEED;if(px>-PW-8)r.push({x:px,top:world.top(i)})}return r}\nfunction scoreAt(f){const d=f-1-(W-BX+PW)/SPEED;return d>0?Math.ceil(d/90):0}\nfunction ell(c,a,b,rx,ry){c.ellipse(a,b,rx,Math.abs(ry),0,0,Math.PI*2)}\nfunction drawBirdAt(c,skin,px,py,r,rot){\n  const s=SKINS[skin]||SKINS[0];c.save();c.translate(px,py);c.rotate(rot);c.scale(r/14,r/14);\n  c.fillStyle=s.b;c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=2;\n  c.beginPath();ell(c,0,0,16,14);c.fill();c.stroke();\n  c.fillStyle='#fff';c.beginPath();c.arc(7,-4,5,0,7);c.fill();\n  c.fillStyle='#000';c.beginPath();c.arc(9,-4,2,0,7);c.fill();\n  c.fillStyle='#ff7043';c.beginPath();ell(c,14,3,7,4);c.fill();\n  c.fillStyle=s.w;c.beginPath();ell(c,-5,3,7,5+Math.sin(Date.now()/60)*2);c.fill();c.stroke();\n  c.restore();\n}\nconst nmOf=p=>String(p.presence.nm).slice(0,14);\nfunction show(id,on){$(id).classList.toggle('show',on)}\nfunction layout(vs){wrap.classList.toggle('vs',vs);cv.width=vs?800:400}\nfunction resetBird(){bird={x:BX,y:280,v:0,r:14};frames=0;score=0}\n\n/* ---------- lobby & shop ---------- */\nfunction renderShop(){\n  $('nameTxt').textContent=save.name;$('coinTxt').textContent=save.coins;$('bestTxt').textContent=save.best;\n  $('muteBtn').textContent=save.mute?'\ud83d\udd07':'\ud83d\udd0a';\n  $('tabB').classList.toggle('on',tab==='birds');$('tabT').classList.toggle('on',tab==='themes');\n  const claimed=save.day===new Date().toDateString();$('dayBtn').disabled=claimed;$('dayBtn').textContent=claimed?'\ud83c\udf81 Claimed':'\ud83c\udf81 +50';\n  const bird_=tab==='birds',list=bird_?SKINS:THEMES,own=bird_?save.owned:save.themes,key=bird_?'sel':'th';\n  const g=$('grid');g.innerHTML='';\n  list.forEach((s,i)=>{\n    const d=document.createElement('div');d.className='card'+(save[key]===i?' sel':'');\n    const pc=document.createElement('canvas');pc.width=pc.height=112;const c=pc.getContext('2d');\n    if(bird_)drawBirdAt(c,i,56,56,26,-0.2);\n    else{const gr=c.createLinearGradient(0,0,0,112);gr.addColorStop(0,s.sky[0]);gr.addColorStop(1,s.sky[1]);c.fillStyle=gr;c.fillRect(0,0,112,112);\n      c.fillStyle=s.pipe;c.fillRect(70,0,26,48);c.fillRect(70,84,26,28);c.fillStyle=s.gr;c.fillRect(0,100,112,12)}\n    const t=document.createElement('div');t.textContent=s.n;\n    const b=document.createElement('button');\n    if(save[key]===i){b.textContent='\u2713 Selected';b.disabled=true}\n    else if(own.includes(i)){b.textContent='Select';b.onclick=()=>{save[key]=i;persist();lpres();renderShop()}}\n    else{b.textContent='Buy \u00b7 \ud83e\ude99 '+s.p;b.disabled=save.coins<s.p;\n      b.onclick=()=>{if(save.coins>=s.p){save.coins-=s.p;own.push(i);save[key]=i;persist();lpres();renderShop()}}}\n    d.append(pc,t,b);g.appendChild(d);\n  });\n}\nfunction lpres(extra){if(room&&save.name)room.presence(Object.assign({nm:save.name,k:save.sel,b:save.best},extra||{})).catch(()=>{})}\nfunction toLobby(){\n  if(vroom){vroom.leave().catch(()=>{});vroom=null}\n  target=null;mode='solo';opp=null;layout(false);state='lobby';lpres({bz:0,to:null,mr:null});\n  ['over','vsmenu','vsover','online','nameov'].forEach(i=>show(i,false));show('lobby',true);renderShop();world=mk(1);resetBird();\n}\nfunction startReady(){mode='solo';layout(false);state='ready';['lobby','over','vsmenu','vsover','online'].forEach(i=>show(i,false));world=mk(Math.random()*4e9);resetBird()}\n\n/* ---------- solo play ---------- */\nfunction flap(){\n  if(state==='ready')state='play';\n  if(state==='play'||state==='vsplay'){bird.v=FLAP;sfx(520,.08,'square',.04)}\n}\nfunction step(){\n  const prev=score;frames++;bird.v+=GRAV;bird.y+=bird.v;score=scoreAt(frames);\n  if(score>prev)sfx(880,.12,'sine',.08);\n  for(const p of pipesAt(frames))\n    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PW&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+GAP))return die();\n  if(bird.y+bird.r>=GROUND||bird.y-bird.r<0)die();\n}\nfunction die(){\n  over=0;sfx(130,.35,'sawtooth',.1);\n  if(mode==='vs'){state='vsdead';pres({al:0,s:score,f:frames,y:Math.round(bird.y),v:0});return}\n  state='over';\n  const earned=coinsFor(score),nb=score>save.best;save.coins+=earned;if(nb){save.best=score;lpres()}persist();\n  $('sTxt').textContent=score;$('eTxt').textContent=earned;$('bTxt').textContent=save.best;$('newBest').textContent=nb&&score>0?'NEW BEST!':'';\n  $('medal').textContent=score>=50?'\ud83e\udd47':score>=25?'\ud83e\udd48':score>=10?'\ud83e\udd49':'';\n  setTimeout(()=>{if(state==='over')show('over',true)},500);\n}\nfunction fall(){over++;if(bird.y<GROUND-bird.r){bird.v+=GRAV;bird.y=Math.min(bird.y+bird.v,GROUND-bird.r)}}\n\n/* ---------- online: find & challenge players ---------- */\nconst myPeer=()=>{const m=room&&room.peers().find(p=>p.isMe&&p.sameTab);return m?m.peer:null};\nfunction openOnline(){state='online';show('lobby',false);show('online',true);$('olMsg').textContent='';renderOnline();$('srch').focus()}\nfunction renderOnline(){\n  const q=$('srch').value.trim().toLowerCase(),L=$('plist');L.innerHTML='';\n  const ps=room?room.peers().filter(p=>!p.isMe&&p.presence&&p.presence.nm&&nmOf(p).toLowerCase().includes(q)).slice(0,30):[];\n  if(!ps.length){L.textContent=q?'No player found with that name.':'No one else is online right now \u2014 ask a friend to open this page!';return}\n  ps.forEach(p=>{\n    const r=document.createElement('div');r.className='pl';\n    const n=document.createElement('span');n.textContent=(p.presence.bz?'\ud83d\udd34 ':'\ud83d\udfe2 ')+nmOf(p)+' \u00b7 best '+(+p.presence.b||0);\n    const b=document.createElement('button');b.className='sm';b.textContent=p.presence.bz?'In match':'\u2694 Challenge';b.disabled=!!p.presence.bz;b.onclick=()=>challenge(p);\n    r.append(n,b);L.appendChild(r);\n  });\n}\nasync function enterMatch(rn,who){\n  try{vroom=await room.join(rn)}catch(e){vroom=null;return false}\n  vcode=who;mode='vs';layout(true);resetBird();world=mk(1);\n  myNonce=Math.random().toString(36).slice(2,10);mySt='wait';state='vswait';\n  show('online',false);show('chal',false);show('lobby',false);show('vsmenu',true);\n  lpres({bz:1});pres({vs:1,n:myNonce,st:'wait',al:1,f:0,s:0,k:save.sel,y:280,v:0});return true;\n}\nasync function challenge(p){\n  const me=myPeer();if(!me)return;\n  const rn=('m-'+me+'-'+p.peer+'-'+Math.random().toString(36).slice(2,6)).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);\n  if(!(await enterMatch(rn,nmOf(p)))){$('olMsg').textContent='Could not start the match.';return}\n  target=p.peer;waitT=Date.now();lpres({to:p.peer,mr:rn});\n}\nfunction cancelWait(msg){toLobby();openOnline();$('olMsg').textContent=msg}\nfunction lobbyTick(){\n  if(!room||(state!=='lobby'&&state!=='online'))return;\n  const me=myPeer();if(!me)return;\n  const c=room.peers().find(p=>!p.isMe&&p.presence&&p.presence.to===me&&p.presence.mr&&!dismissed[p.presence.mr]);\n  if(c&&(!incoming||incoming.peer!==c.peer)){incoming=c;$('chalTxt').textContent='\u2694 '+nmOf(c)+' challenges you!';show('chal',true);sfx(660,.15,'triangle',.08)}\n  else if(!c&&incoming){incoming=null;show('chal',false)}\n}\n\n/* ---------- versus match ---------- */\nfunction pres(p){if(vroom)vroom.presence(p).catch(()=>{})}\nfunction peersVs(){return vroom?vroom.peers().filter(p=>p.presence&&p.presence.vs&&!(p.isMe&&!p.sameTab)).sort((a,b)=>a.peer<b.peer?-1:1).slice(0,2):[]}\nfunction startCd(ps){\n  const ns=ps.map(p=>p.presence.n).sort().join('|');let h=7;\n  for(let i=0;i<ns.length;i++)h=(Math.imul(h,31)+ns.charCodeAt(i))|0;\n  world=mk(h);resetBird();mySt='cd';pres({st:'cd',k:save.sel});state='cd';cdStart=Date.now();\n  show('vsmenu',false);show('vsover',false);\n}\nfunction finishVs(res){\n  if(state==='vsend')return;\n  state='vsend';mySt='over';pres({st:'over',al:0});\n  const os=opp?opp.s||0:0,earned=coinsFor(score)+(res==='win'?25:0),nb=score>save.best;\n  save.coins+=earned;if(nb){save.best=score;lpres()}persist();\n  $('vsRes').textContent=res==='win'?'\ud83c\udfc6 You win!':res==='lose'?'You lose':'Draw';\n  $('vsRes').style.color=res==='win'?'#ffd93b':res==='lose'?'#ff6b6b':'#fff';\n  $('vsMeN').textContent=save.name;$('vsOpN').textContent=vcode;$('vsMe').textContent=score;$('vsOp').textContent=os;$('vsEarn').textContent=earned;\n  if(res==='win')[523,65 a3820}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif;text-align:center}\ncanvas{width:100%;max-width:800px;height:auto;border:2px solid #8a6a2f;background:#000;display:block;margin:8px auto 0;touch-action:none}\n#pad{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px}\n#pad .fight{width:112px;background:#b3262e;color:#fff;font-size:16px;font-weight:bold}\n#pad button{font-size:22px;width:54px;height:48px;border:1px solid #8a6a2f;border-radius:8px;background:var(--btn);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}\np{margin:4px 8px;font-size:13px;opacity:.85}\n<\/style><\/head><body>\n<canvas id=\"c\" width=\"800\" height=\"440\"><\/canvas>\n<div id=\"pad\">\n<button data-k=\"left\">\u25c0<\/button><button data-k=\"right\">\u25b6<\/button><button data-k=\"up\">\u2912<\/button><button data-k=\"down\">\u2913<\/button><button data-k=\"atk\" class=\"fight\">\u2694 FIGHT<\/button><button data-k=\"blk\">\ud83d\udee1<\/button><button data-k=\"sprint\">\ud83d\udca8<\/button><button data-k=\"save\">\ud83d\udcbe<\/button><button data-k=\"shop\">\ud83c\udfea<\/button>\n<\/div>\n<p>Arrows / WASD move \u00b7 \u2191 or Space jump &amp; climb \u00b7 \u2193 drop from ledge \u00b7 X fight (chain hits for a combo) \u00b7 Shift sprint \u00b7 C block \u00b7 R restart \u00b7 L shop \u00b7 V save<\/p>\n<script>\nconst cv=document.getElementById('c'),X=cv.getContext('2d');\nconst T=40,H=11,M=[];let W=48;\nfor(let r=0;r<H;r++)M.push(Array(W).fill('.'));\nconst row=(r,a,b,ch='#')=>{for(let c=a;c<=b;c++)M[r][c]=ch};\nlet DOOR=45*T;\nconst sol=(c,r)=>r<0||c<0||c>=W?true:r>=H?false:M[r][c]==='#';\nfunction moveX(o,dx){o.x+=dx;const a=Math.floor(o.y/T),b=Math.floor((o.y+o.h-.01)/T),c=dx>0?Math.floor((o.x+o.w-.01)/T):Math.floor(o.x/T);\nfor(let r=a;r<=b;r++)if(sol(c,r)){o.x=dx>0?c*T-o.w:(c+1)*T;return true}return false}\nfunction moveY(o,dy){o.y+=dy;const a=Math
